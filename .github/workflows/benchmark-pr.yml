name: PR Benchmark Gatekeeper (Stateless)
on:
  pull_request:
    branches: [ main ]
    paths: [ '**/*.go', 'go.mod', 'go.sum' ]
permissions: { pull-requests: write }
jobs:
  benchmark:
    if: vars.DISABLE_BENCHMARKS != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Checkout Main Baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-code
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          path: pr-code
      - name: Start Valkey
        run: |
          cd pr-code
          docker compose up -d valkey
          until docker compose exec -T valkey valkey-cli ping | grep -q PONG; do
            echo "Waiting for Valkey..."
            sleep 1
          done
      - name: Run Main Benchmarks
        run: |
          cd main-code
          go test -bench=. -run=^$ -benchmem -count=10 ./... | tee /tmp/main.txt
      - name: Run PR Benchmarks
        run: |
          cd pr-code
          go test -bench=. -run=^$ -benchmem -count=10 ./... | tee /tmp/pr.txt
      - name: Compare & Post Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(~/go/bin/benchstat /tmp/main.txt /tmp/pr.txt)
          echo "$OUTPUT"
          cd pr-code && gh pr comment ${{ github.event.pull_request.number }} --body '```text
          '"$OUTPUT"'
          ```' || true
          if echo "$OUTPUT" | grep -q "B/op" | grep -q "+"; then
             echo "Memory regression detected!"
             exit 1
          fi
      - name: Teardown Valkey
        if: always()
        run: |
          cd pr-code
          docker compose down -v
