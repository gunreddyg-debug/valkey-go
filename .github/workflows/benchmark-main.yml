name: Update Benchmark Baseline
on:
  push:
    branches: [ main ]
    paths: [ '**/*.go', 'go.mod', 'go.sum' ]
permissions: { contents: write }
jobs:
  benchmark-main:
    if: vars.DISABLE_BENCHMARKS != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Start Valkey
        run: |
          docker compose up -d valkey
          until docker compose exec -T valkey valkey-cli ping | grep -q PONG; do
            echo "Waiting for Valkey..."
            sleep 1
          done
      - name: Run Main Benchmarks
        run: go test -bench=. -run=^$ -benchmem -count=10 ./... | tee out.txt
      - name: Teardown Valkey
        if: always()
        run: docker compose down -v
      - name: Update gh-pages Baseline
        if: success() || failure()
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: out.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
