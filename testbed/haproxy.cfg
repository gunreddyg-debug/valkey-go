# The "discovery endpoint": one TCP address (127.0.0.1:16379) that load-balances connections
# round robin across all 6 cluster nodes, like a Memorystore discovery endpoint.
#
# - TCP mode: HAProxy picks a node per TCP connection; every command on that connection goes to the
#   same node, so a client's long-lived refresh connection stays on one node.
# - Layer-7 health check (PING -> +PONG, every 1s, down after 2 failures): new connections avoid a
#   node that is paused, killed or hung. A plain TCP connect check would not detect a paused node,
#   because the kernel still accepts connections for a frozen process. Sessions that are already
#   established are left alone (HAProxy default), so a connection that was pinned to a node before it
#   failed keeps going to it.
# - Connection logs (option tcplog) go to `docker logs lf-haproxy` and show the node each
#   connection was sent to.

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 2s
    timeout client 1h
    timeout server 1h
    timeout check 1s

frontend discovery
    bind 127.0.0.1:16379
    default_backend valkey_nodes

backend valkey_nodes
    balance roundrobin
    option tcp-check
    tcp-check connect
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    default-server inter 1s fall 2 rise 2
    server n7101 127.0.0.1:7101 check
    server n7102 127.0.0.1:7102 check
    server n7103 127.0.0.1:7103 check
    server n7104 127.0.0.1:7104 check
    server n7105 127.0.0.1:7105 check
    server n7106 127.0.0.1:7106 check

