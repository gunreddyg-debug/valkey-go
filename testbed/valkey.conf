# Shared config of the 6 cluster nodes. Each container adds --port 710x on the command line.
# Host networking: listen on loopback only, so the cluster is not reachable from outside this workstation.
bind 127.0.0.1
protected-mode no

cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
# Announce the loopback address so CLUSTER SHARDS/SLOTS return addresses the host (and the bench) can dial.
cluster-announce-ip 127.0.0.1

# No persistence: the test bed is recreated between runs.
save ""
appendonly no
dir /data

